<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Studio Admin — Sweet Sentiments</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/tokens.css?v=10">
  <link rel="stylesheet" href="assets/css/base.css?v=10">
  <link rel="stylesheet" href="assets/css/components.css?v=10">

  <style>
    /* ========== Mobile-first admin styles ========== */

    body { background: var(--cream-2); }

    .admin-shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 120px; /* room for sticky save bar */
    }

    .admin-head {
      display: flex; flex-direction: column; gap: 6px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 22px;
    }
    .admin-head h1 {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1.8rem;
      line-height: 1.05;
      color: var(--ink);
      margin: 4px 0 0;
    }
    .admin-head p {
      color: var(--ink-soft);
      margin: 0;
      font-size: 0.94rem;
      line-height: 1.55;
    }
    .admin-head a { color: var(--rouge); }

    .admin-section {
      background: var(--cream);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }
    .admin-section h2 {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1.35rem;
      margin: 0 0 12px;
    }
    .admin-section .help {
      color: var(--ink-soft);
      font-size: 0.88rem;
      margin: 0 0 14px;
      line-height: 1.55;
    }

    /* Form rows: stacked on mobile, 2-up on desktop */
    .field-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .field-stack { display: flex; flex-direction: column; gap: 12px; }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      font-size: 16px; /* prevents iOS zoom */
    }
    .field label {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-soft);
      font-weight: 500;
    }

    /* Product list — stacked card layout on mobile */
    .product-list { display: flex; flex-direction: column; gap: 12px; }
    .product-item {
      display: grid;
      grid-template-areas:
        "thumb info"
        "price price"
        "actions actions";
      grid-template-columns: 64px 1fr;
      gap: 10px 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--cream-2);
      transition: border-color 200ms;
    }
    .product-item.changed { border-color: var(--gold); border-width: 2px; padding: 11px; }
    .product-item.deleted { opacity: 0.5; }
    .product-item.deleted .name,
    .product-item.deleted .meta { text-decoration: line-through; }

    .product-item > img {
      grid-area: thumb;
      width: 64px; height: 64px; border-radius: 10px;
      object-fit: cover;
      display: block;
    }
    .product-item .info {
      grid-area: info;
      display: flex; flex-direction: column; gap: 4px;
      min-width: 0;
      overflow: hidden;
    }
    .product-item .name {
      font-family: var(--font-display);
      font-size: 1.02rem;
      line-height: 1.2;
      display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    }
    .product-item .meta {
      font-size: 0.72rem;
      color: var(--ink-soft);
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .product-item .meta code {
      font-size: 0.78em;
    }

    .product-item .price-input {
      grid-area: price;
      display: flex; align-items: center; gap: 8px;
    }
    .product-item .price-input::before {
      content: "USD";
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-soft);
      font-weight: 500;
      flex: 0 0 auto;
    }
    .product-item .price-input input {
      flex: 1; min-width: 0;
      font-family: var(--font-display);
      font-size: 1.1rem;
      text-align: right;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--cream);
    }

    .product-item .actions {
      grid-area: actions;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .product-item .actions button {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--cream);
      font-size: 0.85rem;
      font-weight: 500;
      transition: background 150ms, border-color 150ms;
      min-height: 40px;
    }
    .product-item .actions button:hover,
    .product-item .actions button:active { background: var(--blush); }
    .product-item .actions .del { color: var(--rouge); }
    .product-item .actions .del:hover,
    .product-item .actions .del:active { background: var(--rouge); color: var(--cream); border-color: var(--rouge); }

    .product-edit {
      grid-column: 1 / -1;
      padding-top: 12px;
      margin-top: 4px;
      border-top: 1px solid var(--line);
      display: none;
    }
    .product-item.editing .product-edit { display: block; }

    /* Add new product form */
    .add-form { display: flex; flex-direction: column; gap: 12px; }
    .add-form .img-row {
      display: flex; flex-direction: column; gap: 12px;
    }
    .add-form .img-preview {
      width: 100%;
      max-width: 240px;
      aspect-ratio: 1/1;
      border: 2px dashed var(--line);
      border-radius: 12px;
      background: var(--cream-2);
      display: flex; align-items: center; justify-content: center;
      color: var(--ink-soft);
      font-size: 0.82rem;
      overflow: hidden;
    }
    .add-form .img-preview img { width: 100%; height: 100%; object-fit: cover; }
    .add-form input[type="file"] { font-size: 0.88rem; }

    /* Sticky save bar — full-width pill on mobile */
    .save-bar {
      position: fixed;
      left: 12px; right: 12px; bottom: 12px;
      background: var(--ink);
      color: var(--cream);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-lg);
      z-index: 50;
    }
    .save-bar .summary { font-size: 0.86rem; line-height: 1.4; }
    .save-bar .summary strong { color: var(--gold); }
    .save-bar .btn-publish {
      background: var(--whatsapp);
      color: white;
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.94rem;
      transition: background 200ms;
      width: 100%;
      min-height: 44px;
    }
    .save-bar .btn-publish:hover,
    .save-bar .btn-publish:active { background: var(--whatsapp-deep); }
    .save-bar .btn-publish:disabled { opacity: 0.5; cursor: not-allowed; }

    .status-bar {
      padding: 10px 12px;
      background: var(--cream-2);
      border-radius: 10px;
      font-size: 0.86rem;
      line-height: 1.5;
      margin-bottom: 12px;
      border-left: 3px solid var(--gold);
    }
    .status-bar.ok { border-left-color: var(--whatsapp); }
    .status-bar.err { border-left-color: var(--rouge); color: var(--burgundy); background: var(--blush); }

    .tag-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      font-weight: 600;
      text-transform: uppercase;
      background: var(--rouge);
      color: var(--cream);
    }
    .tag-badge.gold { background: var(--gold); color: var(--ink); }
    .tag-badge.ink { background: var(--ink); color: var(--cream); }

    code {
      background: var(--cream-2);
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 0.84em;
      word-break: break-all;
    }

    /* Token setup list — readable on small screens */
    #token-section ol {
      padding-left: 18px;
      line-height: 1.65;
      font-size: 0.9rem;
      margin: 12px 0;
    }
    #token-section ol li { margin-bottom: 6px; }

    .btn-ink, .btn-ghost {
      width: 100%;
      min-height: 44px;
      justify-content: center;
    }

    /* ========== Tablet+ (>= 720px) ========== */
    @media (min-width: 720px) {
      .admin-shell { padding: 32px 32px 90px; }
      .admin-head h1 { font-size: 2.4rem; }
      .admin-head p { font-size: 1rem; }
      .admin-section { padding: 28px; border-radius: 18px; margin-bottom: 22px; }
      .admin-section h2 { font-size: 1.55rem; margin-bottom: 16px; }
      .admin-section .help { font-size: 0.92rem; }
      .field-row { grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }

      .product-item {
        grid-template-areas: "thumb info price actions";
        grid-template-columns: 88px 1fr auto auto;
        gap: 18px;
        padding: 14px;
      }
      .product-item.changed { padding: 13px; }
      .product-item img { width: 88px; height: 88px; }
      .product-item .name { font-size: 1.1rem; }
      .product-item .meta { font-size: 0.78rem; white-space: normal; }
      .product-item .price-input { width: 140px; }
      .product-item .price-input::before { display: none; }
      .product-item .actions { grid-template-columns: auto auto; gap: 6px; }
      .product-item .actions button { padding: 8px 14px; font-size: 0.82rem; min-height: 36px; }

      .add-form .img-row { flex-direction: row; align-items: flex-start; }
      .add-form .img-preview { width: 140px; aspect-ratio: 1/1; }

      .save-bar {
        position: sticky;
        left: auto; right: auto;
        bottom: 16px;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        border-radius: 999px;
        padding: 10px 14px 10px 22px;
        margin-top: 24px;
      }
      .save-bar .btn-publish { width: auto; padding: 10px 22px; }

      .btn-ink, .btn-ghost { width: auto; min-height: auto; }
    }

    /* ========== Desktop (>= 1024px) ========== */
    @media (min-width: 1024px) {
      .admin-shell { padding: 40px 40px 80px; }
      .admin-head h1 { font-size: 3rem; }
    }
  </style>
</head>
<body>

  <div class="admin-shell" id="app">
    <div class="status-bar">Loading…</div>
  </div>

  <script>document.write('<script src="assets/js/products.js?t='+Date.now()+'"><\/script>')</script>
  <script>
  // ====================================================================
  // Sweet Sentiments — Studio Admin
  // Edit prices and add products. Saves directly to GitHub.
  // ====================================================================

  const REPO_OWNER = "allandeka379-alt";
  const REPO_NAME  = "sweetsentiments";
  const BRANCH     = "main";
  const PRODUCTS_PATH = "assets/js/products.js";

  // Local in-memory state
  const state = {
    token:      localStorage.getItem("ss-admin-token") || "",
    products:   structuredClone(window.SS_PRODUCTS),
    categories: structuredClone(window.SS_CATEGORIES),
    occasions:  structuredClone(window.SS_OCCASIONS),
    sha:        null,
    deleted:    new Set(),
    pendingImages: [],   // [{ path, base64 }]
    dirty: false
  };

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

  function escapeJsString(s) {
    return String(s)
      .replace(/\\/g, "\\\\")
      .replace(/"/g, '\\"')
      .replace(/\n/g, "\\n")
      .replace(/\r/g, "\\r")
      .replace(/\t/g, "\\t");
  }

  function jsValue(v, indent = 0) {
    const pad = "  ".repeat(indent);
    if (v === null || v === undefined) return "null";
    if (typeof v === "number" || typeof v === "boolean") return String(v);
    if (typeof v === "string") return `"${escapeJsString(v)}"`;
    if (Array.isArray(v)) {
      if (v.length === 0) return "[]";
      const allStrings = v.every(x => typeof x === "string");
      if (allStrings) return `[${v.map(s => jsValue(s)).join(", ")}]`;
      return "[\n" + v.map(x => pad + "  " + jsValue(x, indent + 1)).join(",\n") + "\n" + pad + "]";
    }
    if (typeof v === "object") {
      const keys = Object.keys(v);
      if (keys.length === 0) return "{}";
      return "{\n" +
        keys.map(k => pad + "  " + JSON.stringify(k) + ": " + jsValue(v[k], indent + 1)).join(",\n") +
        "\n" + pad + "}";
    }
    return JSON.stringify(v);
  }

  function generateProductsJs() {
    const lines = [];
    lines.push("/* ========================================================================");
    lines.push("   Sweet Sentiments — Product catalogue");
    lines.push("   ======================================================================== */");
    lines.push("");

    // Strip internal admin-only markers before serialising
    const aliveProducts = state.products
      .filter(p => !state.deleted.has(p.slug))
      .map(p => {
        const clean = {};
        for (const k of Object.keys(p)) {
          if (k.startsWith("_")) continue;
          clean[k] = p[k];
        }
        return clean;
      });
    lines.push("window.SS_PRODUCTS = " + jsValue(aliveProducts) + ";");
    lines.push("");
    lines.push("window.SS_CATEGORIES = " + jsValue(state.categories) + ";");
    lines.push("");
    lines.push("window.SS_OCCASIONS = " + jsValue(state.occasions) + ";");
    lines.push("");
    lines.push("window.SS_findProduct = function(slug){ return window.SS_PRODUCTS.find(p => p.slug === slug); };");
    lines.push("window.SS_byCategory = function(slug){ return window.SS_PRODUCTS.filter(p => p.category === slug); };");
    lines.push("window.SS_byOccasion = function(slug){ return window.SS_PRODUCTS.filter(p => p.occasions.includes(slug)); };");
    lines.push("");

    return lines.join("\n");
  }

  // === GitHub API helpers ===
  async function ghFetch(path, opts = {}) {
    const headers = {
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      ...(opts.headers || {})
    };
    if (state.token) headers.Authorization = `Bearer ${state.token}`;
    const url = `https://api.github.com${path}`;
    const res = await fetch(url, { ...opts, headers });
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch {}
    if (!res.ok) {
      const msg = data?.message || text || `${res.status} ${res.statusText}`;
      throw new Error(msg);
    }
    return data;
  }

  async function loadShaFromGithub() {
    if (!state.token) return null;
    try {
      const data = await ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}/contents/${PRODUCTS_PATH}?ref=${BRANCH}`);
      state.sha = data.sha;
      return data.sha;
    } catch (e) {
      console.warn("Could not load products.js sha:", e.message);
      return null;
    }
  }

  async function publishToGithub() {
    if (!state.token) throw new Error("No GitHub token saved.");

    // Re-fetch latest sha to avoid conflicts
    await loadShaFromGithub();

    // 1. Upload any new images
    for (const img of state.pendingImages) {
      const body = {
        message: `Admin: add image ${img.path.split("/").pop()}`,
        content: img.base64,
        branch: BRANCH
      };
      await ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}/contents/${img.path}`, {
        method: "PUT",
        body: JSON.stringify(body)
      });
    }
    state.pendingImages = [];

    // 2. Commit updated products.js
    const newJs = generateProductsJs();
    const base64 = btoa(unescape(encodeURIComponent(newJs)));
    const body = {
      message: "Admin: update products catalogue",
      content: base64,
      branch: BRANCH,
      ...(state.sha ? { sha: state.sha } : {})
    };
    const result = await ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}/contents/${PRODUCTS_PATH}`, {
      method: "PUT",
      body: JSON.stringify(body)
    });
    state.sha = result.content?.sha || state.sha;
    state.dirty = false;
    state.deleted.clear();
    return result;
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result.split(",")[1]); // strip data:...;base64,
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  function slugify(s) {
    return s.toLowerCase().trim()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "")
      .slice(0, 60);
  }

  function setStatus(msg, kind = "info") {
    const wrap = $("#status");
    if (!wrap) return;
    wrap.className = "status-bar" + (kind === "ok" ? " ok" : kind === "err" ? " err" : "");
    wrap.textContent = msg;
  }

  function markDirty() {
    state.dirty = true;
    renderSaveBar();
  }

  function renderSaveBar() {
    const bar = $("#save-bar");
    if (!bar) return;
    const changed = state.products.filter(p => p._changed).length;
    const added = state.products.filter(p => p._new).length;
    const removed = state.deleted.size;
    const imgs = state.pendingImages.length;
    const total = changed + added + removed + imgs;
    bar.style.display = total > 0 ? "flex" : "none";
    bar.querySelector(".summary").innerHTML =
      `<strong>${total}</strong> change${total === 1 ? "" : "s"} ready · ` +
      `${added} new, ${changed} edited, ${removed} removed${imgs ? `, ${imgs} new image${imgs === 1 ? "" : "s"}` : ""}`;
  }

  // === Rendering ===
  function renderProductList() {
    const list = $("#product-list");
    list.innerHTML = state.products.map((p, idx) => `
      <div class="product-item ${state.deleted.has(p.slug) ? 'deleted' : ''} ${p._changed ? 'changed' : ''}" data-idx="${idx}">
        <img src="${p.image}" alt="">
        <div class="info">
          <div class="name">${p.name}${p.tag ? `<span class="tag-badge ${p.tag === 'NEW' ? 'gold' : p.tag === 'LIMITED' ? 'ink' : ''}">${p.tag}</span>` : ""}</div>
          <div class="meta">${p.categoryLabel} · <code>${p.slug}</code></div>
        </div>
        <div class="price-input">
          <input type="number" min="0" step="1" value="${p.price}" data-act="price" data-idx="${idx}" aria-label="Price USD">
        </div>
        <div class="actions">
          <button data-act="edit" data-idx="${idx}">Edit</button>
          <button class="del" data-act="${state.deleted.has(p.slug) ? 'undelete' : 'delete'}" data-idx="${idx}">${state.deleted.has(p.slug) ? 'Restore' : 'Delete'}</button>
        </div>
        <div class="product-edit">
          <div class="field-row">
            <div class="field">
              <label>Name</label>
              <input type="text" value="${escapeAttr(p.name)}" data-edit="name" data-idx="${idx}">
            </div>
            <div class="field">
              <label>Tag</label>
              <select data-edit="tag" data-idx="${idx}">
                <option value="">—</option>
                <option value="BESTSELLER" ${p.tag === 'BESTSELLER' ? 'selected' : ''}>BESTSELLER</option>
                <option value="NEW" ${p.tag === 'NEW' ? 'selected' : ''}>NEW</option>
                <option value="LIMITED" ${p.tag === 'LIMITED' ? 'selected' : ''}>LIMITED</option>
                <option value="BESPOKE" ${p.tag === 'BESPOKE' ? 'selected' : ''}>BESPOKE</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label>Short description (1 line)</label>
            <input type="text" value="${escapeAttr(p.short)}" data-edit="short" data-idx="${idx}">
          </div>
          <div class="field">
            <label>What's included</label>
            <input type="text" value="${escapeAttr(p.included)}" data-edit="included" data-idx="${idx}">
          </div>
          <div class="field">
            <label>Long description (one paragraph per line)</label>
            <textarea rows="3" data-edit="description" data-idx="${idx}">${(p.description || []).join("\n")}</textarea>
          </div>
        </div>
      </div>
    `).join("");

    // Wire up handlers
    list.addEventListener("click", handleListClick);
    list.addEventListener("input", handleListInput);
    list.addEventListener("change", handleListInput);
  }

  function escapeAttr(s) {
    return String(s || "").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  }

  function handleListClick(e) {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const idx = +b.dataset.idx;
    const act = b.dataset.act;
    const p = state.products[idx];

    if (act === "edit") {
      const item = b.closest(".product-item");
      item.classList.toggle("editing");
    } else if (act === "delete") {
      state.deleted.add(p.slug);
      renderProductList();
      markDirty();
    } else if (act === "undelete") {
      state.deleted.delete(p.slug);
      renderProductList();
      markDirty();
    }
  }

  function handleListInput(e) {
    const t = e.target;
    const idx = +t.dataset.idx;
    if (isNaN(idx)) return;
    const p = state.products[idx];

    if (t.dataset.act === "price") {
      const v = parseFloat(t.value);
      if (!isNaN(v) && v !== p.price) {
        p.price = v;
        p._changed = true;
        markDirty();
        const item = t.closest(".product-item");
        item.classList.add("changed");
      }
      return;
    }

    if (t.dataset.edit) {
      const field = t.dataset.edit;
      let val = t.value;
      if (field === "description") {
        val = val.split(/\n+/).map(s => s.trim()).filter(Boolean);
      }
      if (field === "tag" && val === "") {
        delete p.tag;
      } else {
        p[field] = val;
      }
      p._changed = true;
      markDirty();
      const item = t.closest(".product-item");
      item.classList.add("changed");
    }
  }

  // === Add product form ===
  function renderAddForm() {
    const wrap = $("#add-form");
    wrap.innerHTML = `
      <div class="field-row">
        <div class="field">
          <label>Name *</label>
          <input type="text" id="new-name" placeholder="e.g. Velvet Rose Money Bouquet" required>
        </div>
        <div class="field">
          <label>Price USD *</label>
          <input type="number" id="new-price" min="0" step="1" placeholder="e.g. 95" required>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Category *</label>
          <select id="new-category" required>
            ${state.categories.map(c => `<option value="${c.slug}" data-label="${c.name}">${c.name}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>Tag</label>
          <select id="new-tag">
            <option value="">—</option>
            <option value="BESTSELLER">BESTSELLER</option>
            <option value="NEW" selected>NEW</option>
            <option value="LIMITED">LIMITED</option>
            <option value="BESPOKE">BESPOKE</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Short description (1 line, shown on cards)</label>
        <input type="text" id="new-short" placeholder="e.g. Folded dollars and silk roses, finished in cream.">
      </div>
      <div class="field">
        <label>What's included</label>
        <input type="text" id="new-included" placeholder="e.g. Folded USD notes · 6 silk roses · ribbon · hand-written card">
      </div>
      <div class="field">
        <label>Long description (one paragraph per line)</label>
        <textarea id="new-description" rows="3" placeholder="A bouquet of folded US dollars and silk-blush roses, finished with a gold butterfly..."></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Occasions (hold Ctrl/Cmd to multi-select)</label>
          <select id="new-occasions" multiple size="4">
            ${state.occasions.map(o => `<option value="${o.slug}">${o.name}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>Palette</label>
          <select id="new-palette">
            <option>Pink</option>
            <option>Purple</option>
            <option>Cream</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Product image *</label>
        <div class="img-row">
          <div class="img-preview" id="new-image-preview">No image yet</div>
          <input type="file" id="new-image" accept="image/jpeg,image/png,image/webp">
        </div>
      </div>
      <div>
        <button class="btn btn-ink" id="add-product-btn">Add product to draft</button>
      </div>
    `;

    $("#new-image").addEventListener("change", handleImagePick);
    $("#add-product-btn").addEventListener("click", handleAddProduct);
  }

  let pickedImage = null;
  async function handleImagePick(e) {
    const file = e.target.files[0];
    if (!file) return;
    const base64 = await fileToBase64(file);
    pickedImage = { file, base64 };
    const preview = $("#new-image-preview");
    preview.innerHTML = `<img src="data:${file.type};base64,${base64}">`;
  }

  function handleAddProduct() {
    const name = $("#new-name").value.trim();
    const price = parseFloat($("#new-price").value);
    const category = $("#new-category").value;
    const categoryLabel = $("#new-category").selectedOptions[0]?.dataset.label || category;
    const tag = $("#new-tag").value;
    const short = $("#new-short").value.trim();
    const included = $("#new-included").value.trim();
    const description = $("#new-description").value.split(/\n+/).map(s => s.trim()).filter(Boolean);
    const occasions = [...$("#new-occasions").selectedOptions].map(o => o.value);
    const palette = $("#new-palette").value;

    if (!name || isNaN(price) || !pickedImage) {
      setStatus("Name, price, and image are required.", "err");
      return;
    }

    const slug = slugify(name) + "-" + Date.now().toString(36).slice(-4);
    const ext = pickedImage.file.name.split(".").pop().toLowerCase();
    const imagePath = `assets/images/${slug}.${ext}`;

    state.pendingImages.push({ path: imagePath, base64: pickedImage.base64 });

    state.products.push({
      slug,
      name,
      category,
      categoryLabel,
      occasions: occasions.length ? occasions : ["just-because"],
      price,
      ...(tag ? { tag } : {}),
      image: imagePath,
      images: [imagePath],
      short,
      description: description.length ? description : [short],
      included,
      palette,
      range: price < 50 ? "<50" : price <= 100 ? "50-100" : "100+",
      _new: true
    });

    pickedImage = null;
    setStatus(`Added "${name}" to draft. Click 'Publish to live site' to save.`, "ok");
    renderProductList();
    renderAddForm();
    markDirty();
  }

  // === Publish ===
  async function publish() {
    const btn = $(".btn-publish");
    if (!state.token) {
      setStatus("Save a GitHub token in the access section first.", "err");
      return;
    }
    btn.disabled = true;
    btn.textContent = "Publishing…";
    setStatus("Pushing changes to GitHub…");
    try {
      await publishToGithub();
      setStatus("Published. The live site will update in ~30 seconds.", "ok");
      // Clear _changed flags
      state.products = state.products.filter(p => !state.deleted.has(p.slug));
      state.products.forEach(p => { delete p._changed; delete p._new; });
      state.deleted.clear();
      state.pendingImages = [];
      state.dirty = false;
      renderProductList();
      renderSaveBar();
    } catch (e) {
      setStatus("Publish failed: " + e.message, "err");
      console.error(e);
    } finally {
      btn.disabled = false;
      btn.textContent = "Publish to live site";
    }
  }

  // === Token management ===
  function renderTokenSection() {
    const wrap = $("#token-section");
    wrap.innerHTML = state.token
      ? `
        <div class="status-bar ok">GitHub access connected · token ends in <code>…${state.token.slice(-4)}</code></div>
        <button class="btn btn-ghost" onclick="forgetToken()">Forget token (sign out)</button>
      `
      : `
        <p class="help">
          To publish changes, you need a GitHub Personal Access Token with repo permission. We store it only in this browser, never on a server.
        </p>
        <ol style="padding-left: 20px; line-height: 1.7;">
          <li>Open <a href="https://github.com/settings/tokens?type=beta" target="_blank" rel="noopener">github.com/settings/tokens</a> → Generate new token (fine-grained).</li>
          <li>Repository access: only select <code>${REPO_OWNER}/${REPO_NAME}</code>.</li>
          <li>Permissions → Repository → <strong>Contents: Read and write</strong>.</li>
          <li>Generate, copy the token (starts with <code>github_pat_</code>), paste it below.</li>
        </ol>
        <div class="field" style="margin-top: 12px;">
          <label>GitHub token</label>
          <input type="password" id="token-input" placeholder="github_pat_...">
        </div>
        <button class="btn btn-ink" onclick="saveToken()" style="margin-top: 10px;">Save token</button>
      `;
  }

  function saveToken() {
    const tok = $("#token-input").value.trim();
    if (!tok) return;
    state.token = tok;
    localStorage.setItem("ss-admin-token", tok);
    setStatus("Token saved.", "ok");
    renderTokenSection();
    loadShaFromGithub().then(() => {
      setStatus("Connected to GitHub. Make your changes and hit publish.", "ok");
    }).catch(e => setStatus("Token saved but couldn't reach GitHub: " + e.message, "err"));
  }

  function forgetToken() {
    state.token = "";
    localStorage.removeItem("ss-admin-token");
    setStatus("Token forgotten.", "ok");
    renderTokenSection();
  }
  window.saveToken = saveToken;
  window.forgetToken = forgetToken;

  // === Boot ===
  function render() {
    document.getElementById("app").innerHTML = `
      <div class="admin-head">
        <span class="eyebrow">— Studio admin</span>
        <h1>Sweet Sentiments — control room.</h1>
        <p>Edit prices, change descriptions, add new products. Saving publishes through GitHub; the live site at <a href="https://sweetsenti.com" target="_blank">sweetsenti.com</a> updates within about 30 seconds.</p>
      </div>

      <div id="status" class="status-bar">Loading catalogue…</div>

      <section class="admin-section">
        <h2>1. GitHub access</h2>
        <div id="token-section"></div>
      </section>

      <section class="admin-section">
        <h2>2. Existing products</h2>
        <p class="help">Change a price by editing the number on the right. Click <strong>Edit</strong> for full details. Click <strong>Delete</strong> to remove a product (it stays until you publish).</p>
        <div class="product-list" id="product-list"></div>
      </section>

      <section class="admin-section">
        <h2>3. Add a new product</h2>
        <p class="help">Fill in the details, attach a photo, click <strong>Add to draft</strong>. Then publish all changes together.</p>
        <div id="add-form" class="add-form"></div>
      </section>

      <div class="save-bar" id="save-bar" style="display:none;">
        <div class="summary"></div>
        <button class="btn-publish" onclick="publish()">Publish to live site</button>
      </div>
    `;

    renderTokenSection();
    renderProductList();
    renderAddForm();
    renderSaveBar();

    if (state.token) {
      loadShaFromGithub().then(() => {
        setStatus("Catalogue loaded. Make changes and hit publish.", "ok");
      }).catch(e => setStatus("Catalogue loaded locally. Couldn't reach GitHub: " + e.message, "err"));
    } else {
      setStatus("Catalogue loaded. Add a GitHub token to enable publishing.");
    }
  }

  window.publish = publish;
  document.addEventListener("DOMContentLoaded", render);
  </script>
</body>
</html>
